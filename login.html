    <header>
      <div class="container mx-auto p-4">
        <div class="flex justify-between items-center">
          <div
            class="w-12 h-12 bg-black rounded-full flex items-center justify-center text-gold font-bold shadow-md"
          >
            <span class="text-yellow-400 font-serif">K&T</span>
          </div>
          <div class="flex items-center space-x-4">
            <!-- Bell Icon -->
            <button class="p-2 rounded-full hover:bg-gray-100 transition">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 text-gray-700"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M14 10V6a4 4 0 00-8 0v4a6 6 0 00-4 5v2h16v-2a6 6 0 00-4-5z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M9 18h6a2 2 0 11-4 0"
                />
              </svg>
            </button>
            <!-- User Icon -->
            <button class="p-2 rounded-full hover:bg-gray-100 transition">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6 text-purple-500"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  fill-rule="evenodd"
                  d="M12 12c2.21 0 4-1.79 4-4S14.21 4 12 4s-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>
    <!-- login page -->
    <section class="login-section">
      <div class="flex border-gray-400">
        <!--Login form -->
        <div class="w-full flex items-center justify-center p-8 md:p-12">
          <div class="max-w-md w-full shadow-md p-6 rounded-lg bg-white">
            <h2 class="text-2xl font-bold text-center text-gray-900">
              Login Here
            </h2>
            <p class="mt-2 text-sm text-center text-gray-600">
              Welcome back you’ve been missed!
            </p>

            <!-- Form -->
            <form action="#" method="POST" class="mt-6 space-y-4">
              <!-- Email -->
              <div>
                <input
                  type="email"
                  placeholder="Email"
                  class="w-full px-4 py-2 text-gray-700 bg-gray-50 border rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-600"
                  required
                />
              </div>

              <!-- Password -->
              <div class="relative">
                <input
                  type="password"
                  placeholder="Password"
                  class="w-full px-4 py-2 text-gray-700 bg-gray-50 border rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-600"
                  required
                />
                <!-- Eye Icon -->
                <span
                  class="absolute inset-y-0 right-3 flex items-center text-gray-500 cursor-pointer"
                >
                  👁
                </span>
              </div>

              <!-- Login Button -->
              <button
                type="submit"
                class="w-full py-2 mt-2 text-white bg-yellow-600 rounded-md shadow hover:bg-yellow-700 transition"
              >
                Login
              </button>

              <!-- Remember me -->
              <div
                class="mt-2 text-sm text-yellow-600 cursor-pointer hover:underline"
              >
                Remember me!
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
    <!-- Login Section ends -->
  </body>
</html>
